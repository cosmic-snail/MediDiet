[project]
name = "medidiet"
version = "0.1.1"
description = "Hospital diet agent recommendation engine core"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "httpx>=0.27,<1.0",
    "uvicorn>=0.29,<1.0",
]

[project.optional-dependencies]
# The knowledge package is developed in-repo. Install separately:
#   pip install -e knowledge/
knowledge = ["medidiet-knowledge"]

[tool.setuptools.packages.find]
where = ["src"]
